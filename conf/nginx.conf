# =============================================================================
# PandaExploit — Nginx Reverse Proxy Configuration
# =============================================================================
# Terminates TLS on :443 and proxies to all internal services.
# HTTP (:80) redirects to HTTPS.
# Self-signed certificate is generated by conf/gen-certs.sh.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------
    # Shared proxy settings
    # ------------------------------------------------------------------
    proxy_http_version  1.1;
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        "upgrade";
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # ------------------------------------------------------------------
    # Redirect HTTP → HTTPS
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ------------------------------------------------------------------
    # HTTPS — main dashboard (webapp :3000)
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # --- Webapp (Next.js) ---
        location / {
            proxy_pass http://webapp:3000;
        }

        # --- WebSocket for agent ---
        location /ws/ {
            proxy_pass http://agent:8080;
        }

        # --- Agent Zero iframe passthrough ---
        location /a0/ {
            proxy_pass http://agent-zero:80/;
        }

        # --- SSE: kill chain logs ---
        location /api/kill-chain/ {
            proxy_pass          http://kill-chain-orchestrator:8015;
            proxy_buffering     off;
            proxy_cache         off;
            chunked_transfer_encoding on;
        }

        # --- SSE: recon logs ---
        location /api/recon/ {
            proxy_pass          http://recon-orchestrator:8010;
            proxy_buffering     off;
            proxy_cache         off;
            chunked_transfer_encoding on;
        }

        # --- Promptfoo dashboard ---
        location /promptfoo/ {
            proxy_pass http://promptfoo:15500/;
        }

        # --- Neo4j browser (optional, restrict in prod) ---
        location /neo4j/ {
            proxy_pass http://neo4j:7474/;
        }
    }

    # ------------------------------------------------------------------
    # Agent Zero direct port (optional — disable in strict prod)
    # ------------------------------------------------------------------
    server {
        listen 50001 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://agent-zero:80;
        }
    }
}
