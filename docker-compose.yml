# =============================================================================
# PandaExploit - Unified Docker Compose
# =============================================================================
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f
# Build:  docker compose --profile tools build
# =============================================================================

services:

  # ===========================================================================
  # Databases
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: pandaexploit-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pandaexploit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pandaexploit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pandaexploit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pandaexploit} -d ${POSTGRES_DB:-pandaexploit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pandaexploit

  neo4j:
    image: neo4j:5.26-community
    container_name: pandaexploit-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pandaexploit

  # ===========================================================================
  # Recon Scanner Image (build only — not a running service)
  # Build with: docker compose --profile tools build
  # ===========================================================================

  recon:
    build:
      context: .
      dockerfile: recon/Dockerfile
      network: host
    image: pandaexploit-recon:latest
    profiles: ["tools"]

  # ===========================================================================
  # Backend Services
  # ===========================================================================

  recon-orchestrator:
    build: ./recon_orchestrator
    container_name: pandaexploit-recon-orchestrator
    ports:
      - "${RECON_ORCH_PORT:-8010}:8010"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./recon_orchestrator:/app
      - ./recon:/app/recon:ro
      - ./recon/output:/app/recon/output:rw
      - ./graph_db:/app/graph_db:ro
    environment:
      RECON_PATH: ${PWD}/recon
      RECON_IMAGE: pandaexploit-recon:latest
      # Neo4j: NEO4J_URI for recon containers (host network), NEO4J_URI_INGEST for orchestrator ingest
      NEO4J_URI: bolt://localhost:7687
      NEO4J_URI_INGEST: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}
      NVD_API_KEY: ${NVD_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pandaexploit

  pandaexploit-mcp:
    build:
      context: ./mcp
      dockerfile: pandaexploit-mcp/Dockerfile
    container_name: pandaexploit-mcp
    ports:
      - "${PANDAEXPLOIT_MCP_PORT:-8011}:8011"
    environment:
      PANDAEXPLOIT_WEBAPP_URL: http://webapp:3000
      PANDAEXPLOIT_RECON_ORCH_URL: http://recon-orchestrator:8010
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
    networks:
      - pandaexploit
    restart: unless-stopped

  kali-sandbox:
    build:
      context: ./mcp
      dockerfile: kali-sandbox/Dockerfile
      network: host
    container_name: pandaexploit-kali
    dns:
      - 8.8.8.8
      - 8.8.4.4
    hostname: kali-sandbox
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "${MCP_NAABU_PORT:-8000}:8000"
      - "${MCP_CURL_PORT:-8001}:8001"
      - "${MCP_NUCLEI_PORT:-8002}:8002"
      - "${MCP_METASPLOIT_PORT:-8003}:8003"
      - "${MCP_NIKTO_PORT:-8004}:8004"
      - "${MCP_SQLMAP_PORT:-8005}:8005"
      - "${MCP_NMAP_PORT:-8006}:8006"
      - "${MCP_FFUF_PORT:-8007}:8007"
      - "${MCP_GOBUSTER_PORT:-8008}:8008"
      - "${MCP_HYDRA_PORT:-8009}:8009"
      - "8013:8013"
      - "4444:4444"
    volumes:
      - ./mcp/servers:/opt/mcp_servers
      - ./mcp/output:/opt/output
      - ./mcp/nuclei-templates:/opt/nuclei-templates:ro
    environment:
      PYTHONUNBUFFERED: "1"
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      NAABU_PORT: "8000"
      CURL_PORT: "8001"
      NUCLEI_PORT: "8002"
      METASPLOIT_PORT: "8003"
      NMAP_PORT: "8006"
      FFUF_PORT: "8007"
      GOBUSTER_PORT: "8008"
      HYDRA_PORT: "8009"
      MSF_PROGRESS_PORT: "8013"
      MSF_AUTO_UPDATE: "${MSF_AUTO_UPDATE:-true}"
      NUCLEI_AUTO_UPDATE: "${NUCLEI_AUTO_UPDATE:-true}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      pandaexploit:
      pentest-net:

  agent:
    build: ./agentic
    container_name: pandaexploit-agent
    ports:
      - "${AGENT_PORT:-8090}:8080"
    environment:
      # Neo4j (internal docker network)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}
      # AI provider keys (from root .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VERIFY_SSL: ${OPENAI_VERIFY_SSL:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_VERIFY_SSL: ${GOOGLE_VERIFY_SSL:-false}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # WebSocket config
      WS_HEARTBEAT_INTERVAL: "30"
      WS_TIMEOUT: "300"
      WS_MAX_MESSAGE_SIZE: "10485760"
      # MCP tool servers (internal docker network)
      MCP_CURL_URL: http://kali-sandbox:8001/sse
      MCP_NAABU_URL: http://kali-sandbox:8000/sse
      MCP_METASPLOIT_URL: http://kali-sandbox:8003/sse
      MCP_METASPLOIT_PROGRESS_URL: http://kali-sandbox:8013/progress
      # Webapp API (internal docker network)
      WEBAPP_API_URL: http://webapp:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agentic:/app
      - ./agentic/logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 30s
    networks:
      - pandaexploit

  # ===========================================================================
  # Agent Zero (General-purpose AI agent - separate from PandaExploit agent)
  # ===========================================================================

  agent-zero:
    image: agent0ai/agent-zero:latest
    container_name: pandaexploit-agent-zero
    ports:
      - "${A0_PORT:-50001}:80"
    volumes:
      - ./conf/agent-zero-mcp-servers.json:/app/mcp_servers.json:ro
      # Override A0's conf: pandaexploit uses HTTP at /mcp, not SSE at /sse
      - ./conf/agent-zero-mcp-servers-a0-conf.json:/a0/conf/agent-zero-mcp-servers.json:ro
      # Experimental: mount PandaExploit skill for auto-load (path may vary by A0 version)
      - ./docs/skills/PandaExploit:/a0/usr/skills/PandaExploit:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PANDAEXPLOIT_WEBAPP_URL: http://webapp:3000
      PANDAEXPLOIT_RECON_ORCH_URL: http://recon-orchestrator:8010
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Disable SSL verification for corporate proxies (LiteLLM/httpx)
      SSL_VERIFY: ${A0_SSL_VERIFY:-false}
    depends_on:
      - pandaexploit-mcp
    networks:
      - pandaexploit
    restart: unless-stopped

  # ===========================================================================
  # Frontend
  # ===========================================================================

  # One-time init: syncs Prisma schema to PostgreSQL, then exits
  webapp-init:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm install prisma@6 --save-dev 2>&1 | tail -1 &&
             npx prisma db push --skip-generate --schema ./prisma/schema.prisma"
    volumes:
      - ./webapp/prisma:/app/prisma
      - webapp_prisma_cache:/app/node_modules
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pandaexploit}:${POSTGRES_PASSWORD:-pandaexploit_secret}@postgres:5432/${POSTGRES_DB:-pandaexploit}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pandaexploit
    restart: "no"

  webapp:
    build:
      context: ./webapp
      args:
        NEXT_PUBLIC_AGENT_ZERO_URL: http://localhost:${A0_PORT:-50001}
    container_name: pandaexploit-webapp
    ports:
      - "${WEBAPP_PORT:-3000}:3000"
    volumes:
      # Mount recon output directory so webapp can serve download files
      - ./recon/output:/app/recon/output:ro
    environment:
      # PostgreSQL (Prisma)
      DATABASE_URL: "postgresql://${POSTGRES_USER:-redamon}:${POSTGRES_PASSWORD:-redamon_secret}@postgres:5432/${POSTGRES_DB:-redamon}"
      # Neo4j (server-side graph queries)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}
      # Backend services (server-side API routes → internal docker network)
      RECON_ORCHESTRATOR_URL: http://recon-orchestrator:8010
      AGENT_API_URL: http://agent:8080
      AGENT_WS_URL: ws://agent:8080/ws/agent
      AGENT_ZERO_URL: http://agent-zero:80
      NEXT_PUBLIC_AGENT_ZERO_URL: http://localhost:${A0_PORT:-50001}
      # Recon container connects via host network, needs host-accessible webapp URL
      WEBAPP_URL: http://localhost:${WEBAPP_PORT:-3000}
      # Recon output path (mounted volume)
      RECON_OUTPUT_PATH: /app/recon/output
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      webapp-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pandaexploit

# =============================================================================
# Networks
# =============================================================================

networks:
  pandaexploit:
    name: pandaexploit-network
    driver: bridge
  pentest-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  webapp_prisma_cache:
